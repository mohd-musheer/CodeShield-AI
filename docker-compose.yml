version: '3.8'

services:
  codeshield:
    build:
      context: .
      dockerfile: Dockerfile
    image: codeshield-ai:latest
    container_name: codeshield_app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3-70b-8192}
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      - reports_data:/app/reports
      - logs_data:/app/runtime/logs
    restart: unless-stopped

  # Optional Redis scaling service (commented for scaling template support)
  # redis:
  #   image: redis:7-alpine
  #   container_name: codeshield_redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped

  # Optional PostgreSQL scaling database service
  # db:
  #   image: postgres:15-alpine
  #   container_name: codeshield_db
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_USER=codeshield
  #     - POSTGRES_PASSWORD=codeshield_secure_pass
  #     - POSTGRES_DB=codeshield_security
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  reports_data:
    driver: local
  logs_data:
    driver: local
  # redis_data:
  #   driver: local
  # postgres_data:
  #   driver: local
